<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/style.css">
    <style>
        body { width: 320px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 m-0">
    <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
        <h3 class="text-lg font-bold text-white m-0">Enregistrer la source</h3>
        <button id="settingsBtn" class="text-gray-400 hover:text-white transition-colors cursor-pointer" title="Paramètres">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </div>
    
    <div class="space-y-4">
        <div>
            <label for="url" class="block text-xs font-semibold text-gray-400 mb-1">URL à enregistrer :</label>
            <input type="text" id="url" placeholder="Coller l'URL ici" class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-indigo-500 text-sm text-gray-100">
        </div>

        <div>
            <label for="channel" class="block text-xs font-semibold text-gray-400 mb-1">Salon Webhook :</label>
            <select id="channel" class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-indigo-500 text-sm text-gray-100">
                <option value="">-- Choisir un salon --</option>
            </select>
            <p id="noWebhooksMsg" class="text-xs text-red-400 mt-2 hidden">⚠️ Aucun webhook. Allez dans les paramètres.</p>
        </div>

        <button id="sendBtn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded font-medium transition-colors text-sm disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
            Envoyer à Discord
        </button>
        
        <div id="status" class="text-center text-sm font-medium min-h-[1.5rem] mt-2"></div>
    </div>

    <script type="module" src="./popup.ts"></script>
</body>
</html>

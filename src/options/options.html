<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Paramètres - Kord</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen m-0 p-0">
    <div class="max-w-2xl mx-auto p-8">
        <h1 class="text-2xl font-bold mb-6 text-white text-center">⚙️ Paramètres de Kord</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Webhooks Discord</h2>
            
            <div class="space-y-3 mb-6" id="webhookList">
                <!-- JS will populate this -->
            </div>

            <div class="mt-6 border-t border-gray-700 pt-6">
                <h3 class="text-lg font-medium mb-3">Ajouter un nouveau Webhook</h3>
                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-400 mb-1">Nom du bouton</label>
                        <input type="text" id="newName" placeholder="Ex: Général, Setup..." class="w-full px-3 py-2 rounded bg-gray-900 border border-gray-600 focus:outline-none focus:border-indigo-500 text-sm text-white">
                    </div>
                    <div class="flex-[2]">
                        <label class="block text-sm text-gray-400 mb-1">URL du Webhook</label>
                        <input type="text" id="newUrl" placeholder="https://discord.com/api/webhooks/..." class="w-full px-3 py-2 rounded bg-gray-900 border border-gray-600 focus:outline-none focus:border-indigo-500 text-sm text-white">
                    </div>
                    <div>
                        <button id="addBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded font-medium transition-colors cursor-pointer whitespace-nowrap">Ajouter</button>
                    </div>
                </div>
                <div id="addError" class="text-red-400 text-sm mt-2 hidden">Veuillez remplir tous les champs (l'URL doit commencer par https://discord.com/).</div>
            </div>
        </div>

        <div id="saveStatus" class="mt-4 text-center text-sm font-medium h-6"></div>
    </div>

    <script type="module" src="./options.ts"></script>
</body>
</html>

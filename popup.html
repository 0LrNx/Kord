<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h3>Enregistrer la source</h3>
    
    <div class="field">
        <label for="url">URL à enregistrer :</label>
        <input type="text" id="url" placeholder="Coller l'URL ici">
    </div>

    <div class="field">
        <label for="channel">Salon (Catégorie) :</label>
        <select id="channel">
            <option value="">-- Choisir un salon --</option>
            <option value="webhook_setup">Setup</option>
        </select>
    </div>

    <button id="sendBtn">Envoyer à Discord</button>
    <div id="status"></div>

    <script type="module" src="/popup.js"></script>
</body>
</html>
